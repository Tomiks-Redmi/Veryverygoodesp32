name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: pio-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build
        run: pio run
      - name: Prepare firmware
        run: |
          mkdir -p out
          cp .pio/build/esp32dev/firmware.bin out/
          cp .pio/build/esp32dev/bootloader.bin out/
          cp .pio/build/esp32dev/partitions.bin out/
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32dev
          path: out/
